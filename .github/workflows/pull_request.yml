name: Pull request validation

on:
  pull_request:
    branches: [ '**' ]
    paths:
      - 'build/**'
      - 'docker/Dockerfile'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    name: test
    uses: ./.github/workflows/integration_test.yml
    permissions:
      contents: read

  build:
    needs: integration
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  
  scan:
    needs: build
    uses: ./.github/workflows/scan.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}
    permissions:
      contents: read

  environment:
    needs: [ build, scan ]
    name: test
    uses: ./.github/workflows/environment_test.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}
    permissions:
      contents: read
