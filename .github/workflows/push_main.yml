name: Full CI/CD

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'build/**'
      - 'docker/Dockerfile'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  
jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  integration:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: test
    uses: ./.github/workflows/integration_test.yml
    permissions:
      contents: read

  build:
    needs: integration
    uses: ./.github/workflows/build.yml
  
  scan:
    needs: build
    uses: ./.github/workflows/scan.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  environment:
    needs: [ build, scan ]
    name: test
    uses: ./.github/workflows/environment_test.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  publish:
    needs: [ build, test ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  release:
    if: ${{ !cancelled() && !failure() }}
    needs: [ changes, publish ]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      image_name: ${{ needs.publish.outputs.image_name }}
      image_digest: ${{ needs.publish.outputs.image_digest }}
