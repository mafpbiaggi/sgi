name: Integration test

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5.12'
          extensions: pdo_mysql zip bcmath intl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.12'

      - name: Build frontend assets
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --store-dir ./pnpm/store
          pnpm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run environment for frontend tests
        run: composer run dev > /dev/null 2>&1 &

      - name: Run tests
        run: php artisan test

      - name: Clean up temporary resources
        run: kill -9 $(pgrep -f composer)
