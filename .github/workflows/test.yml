name: Test

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
  
  workflow_dispatch:
    inputs:
      image:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
        default: 'none'

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}/{1}:latest', github.repository_owner, github.event.repository.name) }}

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Download image artifact
        if: inputs.artifact_name != 'none'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        if: inputs.artifact_name != 'none'
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub container registry
        if: inputs.artifact_name == 'none'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Image pull
        if: inputs.artifact_name == 'none'
        run: docker pull $IMAGE

      - name: Generate Laravel application key for tests
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "GITHUB_ENV"

      - name: Create .env file for tests
        run: |
          echo $APP_KEY
          printf '%s\n' \
                      'IMAGE_NAME=${IMAGE}' \
                      'DB_CONNECTION=mariadb' \
                      'DB_HOST=sgi_db' \
                      'DB_PORT=3306' \
                      'DB_DATABASE=sgi_test' \
                      'DB_USERNAME=test' \
                      'DB_PASSWORD=test' \
                      'DB_ROOT_PASSWORD=test' \
                      'APP_NAME=TEST' \
                      'APP_KEY=${APP_KEY}' \
                      'VITE_APP_NAME=TEST' \
                      'PORT_MAPPING=80' > docker/.env

      - name: Start containers
        run: |
          echo $APP_KEY
          docker compose -f docker/docker-compose.yml up -d

      - name: Wait for database container
        run: bash tests/wait_container.sh ${{ github.event.repository.name }}_db

      - name: Wait for application container
        run: bash tests/wait_container.sh ${{ github.event.repository.name }}_app

      - name: Validate application health
        run: bash tests/validate_endpoint.sh

      - name: Clean up temporary resources
        if: always()
        run: | 
          docker rm -f ${{ github.event.repository.name }}_db || true
          docker rm -f ${{ github.event.repository.name }}_app || true
