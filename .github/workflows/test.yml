name: Test

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
  
  workflow_dispatch:
    inputs:
      image:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
        default: 'none'

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}/{1}:latest', github.repository_owner, github.event.repository.name) }}

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Download image artifact
        if: inputs.artifact_name != 'none'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        if: inputs.artifact_name != 'none'
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub container registry
        if: inputs.artifact_name == 'none'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Image pull
        if: inputs.artifact_name == 'none'
        run: docker pull $IMAGE

      - name: Create .env file for tests
        run: |
          printf '%s\n' \
            'IMAGE_NAME=${IMAGE}' \
            'MYSQL_ROOT_PASSWORD=test' \
            'MYSQL_HOST=sgi_db' \
            'MYSQL_DATABASE=sgi_test' \
            'MYSQL_USER=test' \
            'MYSQL_PASSWORD=test' \
            'MYSQL_PORT=3306' \
            'PAGE_TITLE=test' \
            'REPORT_TOP=test' \
            'SGI_BRAND=test' \
            'PORT_MAPPING=80' > docker/.env

      - name: Start containers
        run: docker compose -f docker/docker-compose.yaml up -d

      - name: Wait for container
        run: bash tests/container_status.sh ${{ github.event.repository.name }}_app

      - name: Import database schema
        run: |
          docker cp schema/schema.sql sgi_db:/var/lib/mysql
          docker exec -i sgi_db bash -c 'mariadb -u$MYSQL_USER -p$MYSQL_PASSWORD $MYSQL_DATABASE < /var/lib/mysql/schema.sql'
          
      - name: Check application health
        run: bash tests/health_check_app.sh

      - name: Clean up temporary resources
        if: always()
        run: docker rm -f ${{ github.event.repository.name }} || true
